<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>줄안서 · 연구정책국 업무 도우미</title>
<meta name="theme-color" content="#F2F4F6">
<meta name="description" content="국장실 보고 대기와 회의실 예약을 한 곳에서.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png?v=5">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="줄안서">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/app.css?v=20261106t">
<script src="/js/config.js"></script>
</head>
<body>
<div class="wrap">
  <!-- 첫 화면: 보고 대기 / 회의실 예약 고르기 -->
  <section id="launcher" class="launcher" hidden>
    <p class="l-date" id="l-date"></p>
    <h1 class="l-title">무엇을 하시겠어요?</h1>
    <button type="button" class="l-btn" id="l-queue">
      <i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 5v12" stroke-dasharray="2 2.2"/></svg></i>
      <span><b>국장실 보고 대기</b><small id="l-queue-sub">번호표 받고 자리에서 기다리기</small></span><em aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></em></button>
    <a class="l-btn" id="l-rooms" href="/rooms/">
      <i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/><path d="M9 14h2M13 14h2M9 17h2"/></svg></i>
      <span><b>회의실 예약</b><small id="l-rooms-sub">711호 · 빈 시간 보고 바로 예약</small></span><em aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></em></a>
    <div class="ci"><img src="/img/ci-emblem.png" alt="" width="30" height="29"><span class="org">농촌진흥청</span><span class="sep" aria-hidden="true"></span><span class="dept">연구정책국</span></div>
  </section>

  <header class="top" id="q-top">
    <a class="back" href="/?home=1" aria-label="처음 화면으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="brand"><small id="h-date">보고 대기</small><b id="h-office">국장실 보고 대기</b></div>
    <span class="pill ok" id="h-state"><i></i>불러오는 중</span>
  </header>
  <div id="banner"></div>

  <!-- 접수 코드 -->
  <section id="gate" class="card" hidden>
    <h2>접수 코드를 입력해 주세요</h2>
    <p class="sub">국장실 앞에 붙은 안내문이나 비서실에서 받은 코드입니다. 한 번만 입력하면 됩니다.</p>
    <form id="gate-form">
      <div class="field"><label for="g-code">접수 코드</label><input type="text" id="g-code" inputmode="numeric" autocomplete="one-time-code" maxlength="12"></div>
      <p class="err-msg" id="g-err" role="alert"></p>
      <button class="btn block" type="submit">확인</button>
    </form>
  </section>

  <!-- 번호표 받기 -->
  <section data-tab="apply" hidden>
    <div id="push-card"></div>
    <div class="card" id="apply-summary"></div>
    <div class="card">
      <form id="apply-form" novalidate>
        <h2 class="h-big">번호표 받기</h2>
        <div class="field"><label for="f-name">이름</label><input type="text" id="f-name" autocomplete="name" placeholder="홍길동" maxlength="20"></div>
        <div class="field"><label for="f-dept">부서</label><input type="text" id="f-dept" placeholder="두세 글자 입력 (예: 연구정, 농과원 토양)" maxlength="40">
          <span class="hint">입력하면 아래에 부서가 나옵니다. <button type="button" class="linkbtn" id="f-dept-browse" aria-expanded="false">목록에서 고르기</button></span>
          <div class="org-browse" id="f-dept-panel" hidden></div>
        </div>
        <div class="field"><label for="f-topic">보고 건명 <span class="hint">(선택)</span></label><input type="text" id="f-topic" placeholder="국정감사 예상질의 답변자료" maxlength="60"><span class="hint">비서실에만 보이고 현황판에는 나오지 않습니다.</span></div>
        <div class="field"><label for="f-ref">예상 소요 시간 <span class="hint">(선택 · 참고용)</span></label>
          <div class="refchips" id="f-ref-chips"><button type="button" data-ref="5">5분</button><button type="button" data-ref="10">10분</button><button type="button" data-ref="20">20분</button><button type="button" data-ref="30">30분</button></div>
          <div class="inline-unit"><input type="number" id="f-ref" inputmode="numeric" min="1" max="180" step="1" placeholder="직접 입력"><span>분</span></div>
          <span class="hint">순서는 신청 순으로 정해지고, 소요 시간은 비서실 참고용입니다.</span>
        </div>
        <p class="err-msg" id="f-err" role="alert"></p>
        <button class="btn block" id="f-submit" type="submit">번호표 받기</button>
      </form>
    </div>
    <div id="emerg-card"></div>
  </section>

  <!-- 내 번호표 -->
  <section data-tab="mine" hidden><div id="mine" class="wrap" style="max-width:none"></div></section>

  <!-- 현황 -->
  <section data-tab="board" hidden><div id="board" class="wrap" style="max-width:none"></div></section>
</div>

<nav class="tabs" id="nav" aria-label="화면 이동" hidden><div class="in">
  <button type="button" data-tab-btn="apply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>번호표 받기</button>
  <button type="button" data-tab-btn="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 12h2M18 12h2M10 10v4M14 10v4"/></svg><span>내 번호표<span class="badge" id="nav-badge" hidden></span></span></button>
  <button type="button" data-tab-btn="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>대기 현황</button>
</div></nav>

<script type="module" src="/js/app.js"></script>
</body>
</html>
