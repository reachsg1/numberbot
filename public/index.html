<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보고 대기 번호표</title>
<meta name="theme-color" content="#1E5C48">
<meta name="description" content="국장실 보고 대기 번호표를 받고, 차례가 되면 알림을 받습니다.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="보고 대기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small id="h-date">보고 대기</small><b id="h-office">국장실 보고 대기</b></div>
    <span class="pill ok" id="h-state"><i></i>불러오는 중</span>
  </header>
  <div id="banner"></div>

  <!-- 접수 코드 -->
  <section id="gate" class="card" hidden>
    <h2>접수 코드를 입력해 주세요</h2>
    <p class="sub">국장실 앞에 붙은 안내문이나 비서실에서 받은 코드입니다. 한 번만 입력하면 됩니다.</p>
    <form id="gate-form">
      <div class="field"><label for="g-code">접수 코드</label><input type="text" id="g-code" inputmode="numeric" autocomplete="one-time-code" maxlength="12"></div>
      <p class="err-msg" id="g-err" role="alert"></p>
      <button class="btn block" type="submit">확인</button>
    </form>
  </section>

  <!-- 번호표 받기 -->
  <section data-tab="apply" hidden>
    <div id="push-card"></div>
    <div class="card" id="apply-summary"></div>
    <div class="card">
      <form id="apply-form" novalidate>
        <h2>번호표 받기</h2>
        <div class="field"><label for="f-name">이름</label><input type="text" id="f-name" autocomplete="name" placeholder="홍길동" maxlength="20"></div>
        <div class="field"><label for="f-dept">부서</label><input type="text" id="f-dept" placeholder="두세 글자 입력 (예: 연구정, 농과원 토양)" maxlength="40">
          <span class="hint">입력하면 아래에 부서가 나옵니다. <button type="button" class="linkbtn" id="f-dept-browse" aria-expanded="false">목록에서 고르기</button></span>
          <div class="org-browse" id="f-dept-panel" hidden></div>
        </div>
        <div class="field"><label for="f-topic">보고 건명 <span class="hint">(선택)</span></label><input type="text" id="f-topic" placeholder="국정감사 예상질의 답변자료" maxlength="60"><span class="hint">비서실에만 보이고 현황판에는 나오지 않습니다.</span></div>
        <div class="field"><label for="f-ref">예상 소요 시간 <span class="hint">(선택 · 참고용)</span></label>
          <div class="inline-unit"><input type="number" id="f-ref" inputmode="numeric" min="1" max="180" step="1" placeholder="예: 10"><span>분</span></div>
          <span class="hint">순서는 신청 순으로 정해지고, 소요 시간은 비서실 참고용입니다.</span>
        </div>
        <p class="err-msg" id="f-err" role="alert"></p>
        <button class="btn block" id="f-submit" type="submit">번호표 받기</button>
      </form>
    </div>
  </section>

  <!-- 내 번호표 -->
  <section data-tab="mine" hidden><div id="mine" class="wrap" style="max-width:none"></div></section>

  <!-- 현황 -->
  <section data-tab="board" hidden><div id="board" class="wrap" style="max-width:none"></div></section>
</div>

<nav class="tabs" id="nav" aria-label="화면 이동" hidden><div class="in">
  <button type="button" data-tab-btn="apply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>번호표 받기</button>
  <button type="button" data-tab-btn="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 12h2M18 12h2M10 10v4M14 10v4"/></svg><span>내 번호표<span class="badge" id="nav-badge" hidden></span></span></button>
  <button type="button" data-tab-btn="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>대기 현황</button>
</div></nav>

<script type="module" src="/js/app.js"></script>
</body>
</html>
